<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title">
  <title id="title">Front desk check-in and checkout guide illustration</title>
  <rect width="960" height="420" rx="24" fill="#f1f5f9"/><rect x="20" y="20" width="920" height="380" rx="18" fill="white" stroke="#dbe3ef"/>
  <rect x="20" y="20" width="920" height="56" rx="18" fill="#172554"/><text x="48" y="55" fill="white" font-family="Arial" font-size="16" font-weight="700">FRONT DESK</text>
  <rect x="48" y="96" width="864" height="58" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="120" fill="#1d4ed8" font-family="Arial" font-size="11" font-weight="700">1 · SELECT DATE</text><text x="70" y="141" fill="#334155" font-family="Arial" font-size="13">Choose operation date and check-in / check-out tab</text>
  <rect x="48" y="170" width="398" height="188" rx="14" fill="#eff6ff"/><rect x="462" y="170" width="450" height="188" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="199" fill="#1e3a8a" font-family="Arial" font-size="13" font-weight="700">2 · FIND BOOKING</text>
  <g fill="white"><rect x="68" y="213" width="358" height="48" rx="9"/><rect x="68" y="270" width="358" height="48" rx="9"/></g>
  <g fill="#64748b"><rect x="84" y="228" width="115" height="7" rx="3"/><rect x="84" y="242" width="250" height="6" rx="3"/><rect x="84" y="285" width="115" height="7" rx="3"/><rect x="84" y="299" width="250" height="6" rx="3"/></g>
  <text x="486" y="199" fill="#0f172a" font-family="Arial" font-size="13" font-weight="700">3 · VERIFY DETAILS</text>
  <g fill="#cbd5e1"><rect x="488" y="220" width="175" height="8" rx="4"/><rect x="488" y="240" width="350" height="7" rx="3"/><rect x="488" y="261" width="310" height="7" rx="3"/><rect x="488" y="282" width="340" height="7" rx="3"/></g>
  <rect x="488" y="311" width="170" height="32" rx="8" fill="#2563eb"/><rect x="672" y="311" width="214" height="32" rx="8" fill="#059669"/>
  <text x="573" y="332" fill="white" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">4 · CHECK IN / CHECK OUT</text>
  <text x="50" y="382" fill="#92400e" font-family="Arial" font-size="11">Before checkout, reconcile charges, services, payments, and refund choice.</text>
</svg>
