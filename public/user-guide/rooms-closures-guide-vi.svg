<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title">
  <title id="title">Minh họa trạng thái phòng và lịch bận</title>
  <rect width="960" height="420" rx="24" fill="#f1f5f9"/><rect x="20" y="20" width="920" height="380" rx="18" fill="white" stroke="#dbe3ef"/>
  <text x="50" y="60" fill="#0f172a" font-family="Arial" font-size="18" font-weight="700">QUẢN LÝ PHÒNG &amp; LỊCH BẬN</text>
  <rect x="50" y="82" width="540" height="276" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="72" y="112" fill="#0f172a" font-family="Arial" font-size="12" font-weight="700">1 · KIỂM TRA TRẠNG THÁI PHÒNG</text>
  <g font-family="Arial" font-size="10" font-weight="700" text-anchor="middle"><rect x="72" y="130" width="145" height="78" rx="12" fill="#dcfce7"/><text x="144" y="164" fill="#15803d">SẴN SÀNG</text><text x="144" y="187" fill="#166534">Có thể sử dụng</text><rect x="232" y="130" width="145" height="78" rx="12" fill="#dbeafe"/><text x="304" y="164" fill="#1d4ed8">ĐANG Ở</text><text x="304" y="187" fill="#1e40af">Khách lưu trú</text><rect x="392" y="130" width="170" height="78" rx="12" fill="#fef3c7"/><text x="477" y="164" fill="#b45309">ĐANG DỌN</text><text x="477" y="187" fill="#92400e">Đã giao nhân viên</text></g>
  <rect x="72" y="228" width="496" height="102" rx="12" fill="white" stroke="#e2e8f0"/><text x="92" y="256" fill="#1d4ed8" font-family="Arial" font-size="11" font-weight="700">2 · DANH SÁCH PHÒNG / CẤU HÌNH GIÁ</text><g fill="#cbd5e1"><rect x="92" y="274" width="210" height="7" rx="3"/><rect x="92" y="294" width="435" height="7" rx="3"/><rect x="92" y="314" width="320" height="6" rx="3"/></g>
  <rect x="610" y="82" width="300" height="276" rx="14" fill="#fffbeb" stroke="#fde68a"/><text x="634" y="112" fill="#92400e" font-family="Arial" font-size="12" font-weight="700">3 · LỊCH BẬN</text>
  <rect x="634" y="132" width="252" height="76" rx="10" fill="white"/><text x="652" y="158" fill="#0f172a" font-family="Arial" font-size="11" font-weight="700">Tiêu đề lịch</text><text x="652" y="184" fill="#64748b" font-family="Arial" font-size="10">Ngày bắt đầu → ngày kết thúc</text>
  <rect x="634" y="224" width="252" height="54" rx="10" fill="#fef3c7"/><text x="652" y="247" fill="#92400e" font-family="Arial" font-size="10" font-weight="700">4 · NGÀY BỊ ẢNH HƯỞNG SẼ BỊ CHẶN</text><text x="652" y="264" fill="#92400e" font-family="Arial" font-size="9">Kiểm tra đúng phạm vi chi nhánh</text>
  <rect x="634" y="294" width="252" height="40" rx="9" fill="#2563eb"/><text x="760" y="319" fill="white" font-family="Arial" font-size="9" font-weight="700" text-anchor="middle">CHỈ QUẢN LÝ / QUẢN TRỊ TẠO LỊCH</text>
</svg>
