  </g>
  <rect x="50" y="148" width="540" height="212" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="74" y="180" fill="#0f172a" font-family="Arial" font-size="14" font-weight="700">Thông tin booking</text>
  <g fill="white" stroke="#cbd5e1"><rect x="74" y="196" width="230" height="42" rx="8"/><rect x="320" y="196" width="244" height="42" rx="8"/><rect x="74" y="250" width="490" height="42" rx="8"/><rect x="74" y="304" width="490" height="36" rx="8"/></g>
  <g font-family="Arial" font-size="10" fill="#64748b"><text x="88" y="213">Ngày nhận phòng</text><text x="334" y="213">Ngày trả phòng</text><text x="88" y="267">Chọn loại phòng · số lượng · sức chứa</text><text x="88" y="326">Tên khách · số điện thoại · số khách</text></g>
  <rect x="612" y="148" width="298" height="212" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text x="636" y="180" fill="#1e3a8a" font-family="Arial" font-size="14" font-weight="700">Phòng trống &amp; tổng tiền</text>
