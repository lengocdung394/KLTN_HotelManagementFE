<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title">
  <title id="title">Minh họa bảng tổng quan chi nhánh</title>
  <rect width="960" height="420" rx="24" fill="#f1f5f9"/><rect x="18" y="18" width="924" height="384" rx="18" fill="#fff" stroke="#dbe3ef"/>
  <rect x="18" y="18" width="164" height="384" rx="18" fill="#172554"/><rect x="35" y="42" width="128" height="28" rx="8" fill="#1d4ed8"/>
  <text x="45" y="61" fill="white" font-family="Arial" font-size="11" font-weight="700">TỔNG QUAN</text>
  <g fill="#94a3b8"><rect x="39" y="94" width="105" height="9" rx="4"/><rect x="39" y="124" width="105" height="9" rx="4"/><rect x="39" y="154" width="105" height="9" rx="4"/><rect x="39" y="184" width="105" height="9" rx="4"/><rect x="39" y="214" width="105" height="9" rx="4"/></g>
  <rect x="202" y="42" width="706" height="38" rx="10" fill="#f8fafc"/><text x="220" y="66" fill="#334155" font-family="Arial" font-size="12">Chào buổi sáng · Ngày hôm nay · Chi nhánh</text>
  <g font-family="Arial" font-weight="700" font-size="11" text-anchor="middle">
    <rect x="202" y="98" width="164" height="72" rx="12" fill="#172554"/><text x="284" y="124" fill="#bfdbfe">1 · DOANH THU HÔM NAY</text><text x="284" y="150" fill="white">Tổng thu thuần</text>
    <rect x="378" y="98" width="164" height="72" rx="12" fill="#eff6ff"/><text x="460" y="124" fill="#1d4ed8">2 · CÔNG SUẤT PHÒNG</text><text x="460" y="150" fill="#0f172a">Phòng đang sử dụng</text>
    <rect x="554" y="98" width="164" height="72" rx="12" fill="#f0fdf4"/><text x="636" y="124" fill="#15803d">3 · KHÁCH ĐANG Ở</text><text x="636" y="150" fill="#0f172a">Số khách lưu trú</text>
    <rect x="730" y="98" width="178" height="72" rx="12" fill="#fff7ed"/><text x="819" y="124" fill="#c2410c">4 · ĐẾN &amp; ĐI HÔM NAY</text><text x="819" y="150" fill="#0f172a">Chờ nhận / trả phòng</text>
  </g>
  <rect x="202" y="188" width="706" height="190" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="224" y="219" fill="#0f172a" font-family="Arial" font-size="14" font-weight="700">5 · LỊCH CHECK-IN / CHECK-OUT</text>
  <rect x="224" y="236" width="310" height="54" rx="10" fill="#dbeafe"/><rect x="550" y="236" width="336" height="54" rx="10" fill="#fef3c7"/>
  <text x="242" y="258" fill="#1e3a8a" font-family="Arial" font-size="11" font-weight="700">KHÁCH CHỜ CHECK-IN</text><text x="242" y="276" fill="#475569" font-family="Arial" font-size="10">Chọn dòng để mở quầy lễ tân</text>
  <text x="568" y="258" fill="#92400e" font-family="Arial" font-size="11" font-weight="700">KHÁCH CHỜ CHECK-OUT</text><text x="568" y="276" fill="#475569" font-family="Arial" font-size="10">Chọn ngày để xem lịch khác</text>
  <rect x="224" y="306" width="310" height="52" rx="10" fill="#f0fdf4"/><rect x="550" y="306" width="336" height="52" rx="10" fill="#f1f5f9"/>
  <text x="242" y="337" fill="#15803d" font-family="Arial" font-size="11" font-weight="700">CHECK-IN SỚM</text><text x="568" y="337" fill="#334155" font-family="Arial" font-size="11" font-weight="700">DỊCH VỤ CẦN XÁC NHẬN</text>
</svg>
