<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title">
  <title id="title">Minh họa cổng quản trị hệ thống</title>
  <rect width="960" height="420" rx="24" fill="#f1f5f9"/><rect x="20" y="20" width="920" height="380" rx="18" fill="white" stroke="#dbe3ef"/>
  <rect x="20" y="20" width="190" height="380" rx="18" fill="#172554"/><text x="44" y="58" fill="white" font-family="Arial" font-size="13" font-weight="700">QUẢN TRỊ HỆ THỐNG</text>
  <g fill="#94a3b8"><rect x="44" y="90" width="128" height="8" rx="4"/><rect x="44" y="120" width="128" height="8" rx="4"/><rect x="44" y="150" width="128" height="8" rx="4"/><rect x="44" y="180" width="128" height="8" rx="4"/><rect x="44" y="210" width="128" height="8" rx="4"/><rect x="44" y="240" width="128" height="8" rx="4"/></g>
  <rect x="232" y="44" width="680" height="52" rx="12" fill="#eff6ff"/><text x="258" y="76" fill="#1e3a8a" font-family="Arial" font-size="12" font-weight="700">1 · CHỌN ĐỐI TƯỢNG / PHẠM VI ÁP DỤNG</text>
  <rect x="232" y="114" width="320" height="226" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="256" y="146" fill="#0f172a" font-family="Arial" font-size="11" font-weight="700">2 · CHI NHÁNH &amp; DANH MỤC</text>
  <g font-family="Arial" font-size="9"><rect x="254" y="162" width="276" height="42" rx="8" fill="white"/><text x="272" y="188" fill="#334155">Chọn tỉnh / chi nhánh</text><rect x="254" y="214" width="276" height="42" rx="8" fill="white"/><text x="272" y="240" fill="#334155">Quản lý tiện nghi / loại giường</text><rect x="254" y="266" width="276" height="42" rx="8" fill="white"/><text x="272" y="292" fill="#334155">Quản lý tài khoản / phân quyền</text></g>
  <rect x="574" y="114" width="338" height="226" rx="14" fill="#fffbeb" stroke="#fde68a"/><text x="598" y="146" fill="#92400e" font-family="Arial" font-size="11" font-weight="700">3 · TẠO LỊCH BẬN</text>
  <g fill="white" stroke="#fde68a"><rect x="598" y="162" width="290" height="38" rx="8"/><rect x="598" y="210" width="140" height="38" rx="8"/><rect x="748" y="210" width="140" height="38" rx="8"/></g>
  <g fill="#64748b" font-family="Arial" font-size="8"><text x="614" y="185">Tiêu đề · mô tả lịch</text><text x="614" y="233">Ngày bắt đầu</text><text x="764" y="233">Ngày kết thúc</text></g>
  <rect x="598" y="262" width="290" height="30" rx="7" fill="#dbeafe"/><text x="614" y="282" fill="#1e40af" font-family="Arial" font-size="8">4 · CHỌN TẤT CẢ HOẶC CHI NHÁNH CỤ THỂ</text>
  <rect x="598" y="302" width="290" height="26" rx="7" fill="#2563eb"/><text x="743" y="320" fill="white" font-family="Arial" font-size="8" font-weight="700" text-anchor="middle">KIỂM TRA TRÙNG · GỬI THÔNG BÁO</text>
  <text x="232" y="371" fill="#92400e" font-family="Arial" font-size="9">Kiểm tra phạm vi, thời gian và ảnh hưởng trước khi lưu cấu hình hệ thống.</text>
</svg>
