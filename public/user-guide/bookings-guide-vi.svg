  <text x="50" y="62" fill="#0f172a" font-family="Arial" font-size="19" font-weight="700">QUẢN LÝ ĐẶT PHÒNG · TẠO BOOKING</text>
  <g font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">
    <rect x="50" y="84" width="194" height="42" rx="12" fill="#dbeafe"/><text x="147" y="110" fill="#1d4ed8">1 · NGÀY LƯU TRÚ</text>
