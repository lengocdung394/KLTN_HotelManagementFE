<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title">
  <title id="title">Room selection illustration</title>
  <rect width="960" height="420" rx="24" fill="#f3f4f6"/>
  <rect x="22" y="22" width="916" height="376" rx="20" fill="white"/>
  <text x="52" y="62" fill="#0f172a" font-family="Arial" font-size="20" font-weight="700">Select dates and rooms</text>
  <rect x="52" y="82" width="856" height="62" rx="12" fill="#eff6ff"/>
  <text x="72" y="108" fill="#1e3a8a" font-family="Arial" font-size="12" font-weight="700">CHECK-IN / CHECK-OUT</text>
  <text x="72" y="129" fill="#334155" font-family="Arial" font-size="13">Choose dates · confirm guest count · review closure notice</text>
  <g font-family="Arial">
    <rect x="52" y="162" width="856" height="84" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="68" y="176" width="112" height="56" rx="8" fill="#cbd5e1"/>
    <rect x="194" y="176" width="372" height="56" rx="8" fill="white"/>
    <text x="210" y="198" fill="#0f172a" font-size="14" font-weight="700">Room type · capacity</text>
    <text x="210" y="219" fill="#64748b" font-size="12">Amenities · rate per night · availability</text>
    <text x="718" y="199" fill="#64748b" font-size="11">ROOMS</text><text x="718" y="222" fill="#0f172a" font-size="14">−　1　+</text>
    <rect x="52" y="260" width="856" height="84" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="68" y="274" width="112" height="56" rx="8" fill="#dbeafe"/>
    <rect x="194" y="274" width="372" height="56" rx="8" fill="white"/>
    <text x="210" y="296" fill="#0f172a" font-size="14" font-weight="700">Another room type</text>
    <text x="210" y="317" fill="#64748b" font-size="12">Review features and total before selecting</text>
    <text x="718" y="297" fill="#64748b" font-size="11">ROOMS</text><text x="718" y="320" fill="#0f172a" font-size="14">−　0　+</text>
  </g>
  <rect x="52" y="358" width="856" height="24" rx="8" fill="#fef3c7"/>
  <text x="68" y="375" fill="#92400e" font-family="Arial" font-size="11">Busy / closed dates cannot be booked. Choose different dates if necessary.</text>
</svg>
